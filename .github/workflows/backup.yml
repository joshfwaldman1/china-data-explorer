# A green run means a downloaded, integrity-checked and independently restored
# snapshot was uploaded with its manifest and checksum. Missing credentials fail.

name: China store backup

on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC daily, after the day's releases and refreshes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-store-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require backup credentials
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "::error::BACKUP_TOKEN must be configured in repository secrets and on the service. No backup was taken."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Download a consistent copy of the store
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SITE: https://econstats-china-production.up.railway.app
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/china-backup"
          mkdir -p "$directory"
          name="china-$(date -u +%F).db"
          curl -fS --retry 3 --retry-delay 60 --retry-all-errors --retry-max-time 3600 \
            --connect-timeout 30 --max-time 2400 \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            --dump-header "$directory/headers.txt" \
            --output "$directory/$name" "$SITE/api/backup"
          echo "BACKUP_FILE=$directory/$name" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - name: Verify checksum, integrity and an independent restore
        run: bun scripts/verify-backup.ts "$BACKUP_FILE" "$RUNNER_TEMP/china-backup/headers.txt"

      - name: Keep the verified copy for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_FILE }}.manifest.json
            ${{ env.BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
