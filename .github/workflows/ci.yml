# Every push and pull request: the type check and the whole test suite, the
# same two gates a dataset round has to pass locally. The suite is
# network-free (every publisher is a captured fixture) except for the
# headless render test, which needs a browser; Playwright's Chromium is
# installed for it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the render test
        run: bunx playwright install --with-deps chromium

      - name: Type check
        run: bun run typecheck

      - name: Test
        # The render test launches Playwright's own Chromium here; locally it
        # uses the installed Chrome.
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: bun test
