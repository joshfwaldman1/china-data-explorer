# Railway config for the China Data Explorer. A volume mounted at /data holds
# the store; add it in the dashboard or with
# `railway volume add --mount-path /data`, which is not expressible here.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ready"
# Railway does NOT read this file for the production service. The service has
# `railwayConfigFile` unset and carries its own settings, which override this
# one; the value below is documentation of what the service holds, not what
# sets it. Change it with the API, as OPERATIONS.md describes:
#   serviceInstanceUpdate(input: { healthcheckTimeout: 420 })
# Raising it here alone did nothing, and the deploy that followed failed at
# exactly 180 s (21 September 2026).
#
# Why 420: /ready answers 503 until the catalog is warm, and warming it on the
# deployed instance has been measured at 168.5 s and 179.8 s. At 180 s the
# second missed by two seconds, the new container was killed, and the previous
# one — which shares the volume — stopped answering until restarted by hand.
healthcheckTimeout = 420
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
