# Railway config for the China Data Explorer. A volume mounted at /data holds
# the store; add it in the dashboard or with
# `railway volume add --mount-path /data`, which is not expressible here.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ready"
# /ready answers 503 until the catalog is warm, and warming it on the deployed
# instance has been measured at 168.5 s and 179.8 s. With the window at 180 s
# the second of those missed by two seconds, the new container was killed, and
# the previous one — which shares the volume — was left not answering at all.
# The site was down until it was restarted by hand (21 September 2026). The
# window is now well clear of the warm-up; making the warm-up itself faster is
# the real fix and is recorded in OPERATIONS.md.
healthcheckTimeout = 420
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
