# Railway config for the China Data Explorer. A volume mounted at /data holds
# the store; add it in the dashboard or with
# `railway volume add --mount-path /data`, which is not expressible here.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
